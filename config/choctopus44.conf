CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_POINTING=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=y

# BLE passkey pairing (MITM protection)
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Experimental BLE connection handling (fixes flaky-host edge cases)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Radio TX power boost (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
